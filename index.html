<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ON:BIT YOUTH</title>
  <style>
    :root {
      --bg: #f6f4fb;
      --card: #ffffff;
      --ink: #1d1a27;
      --muted: #6c667d;
      --line: #e6e0f2;
      --primary: #7c5cff;
      --primary-soft: #efeaff;
      --ok: #15803d;
      --ok-soft: #dcfce7;
      --warn: #b91c1c;
      --warn-soft: #fee2e2;
      --edit: #2563eb;
      --edit-soft: #dbeafe;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding-bottom: 48px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 720px;
      margin: 0 auto 10px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .sync-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-width: 720px;
      margin: 0 auto;
    }

    .tab-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      padding: 9px 6px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    main {
      max-width: 720px;
      margin: 16px auto 0;
      padding: 0 14px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-val { font-size: 24px; font-weight: 800; margin-top: 2px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 800;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 10px;
      background: #fcfbfe;
    }

    .item-main { min-width: 0; flex: 1; }
    .item-title { font-weight: 700; font-size: 15px; }
    .item-sub { font-size: 13px; color: var(--muted); margin-top: 2px; word-break: break-word; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-ok { background: var(--ok-soft); color: var(--ok); }
    .btn-no { background: var(--warn-soft); color: var(--warn); }
    .btn-edit { background: var(--edit-soft); color: var(--edit); }
    .btn-del { background: #f3f4f6; color: #374151; }

    .btn-primary {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      margin-top: 8px;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    .field {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d8d1e8;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 10px;
      background: #fff;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .edit-panel {
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #f5f3ff;
      border: 1px solid #d8ccff;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-title">ON:BIT YOUTH</div>
      <div class="sync-badge" id="syncStatus">로컬 저장 활성</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="attendance">출석부</button>
      <button class="tab-btn" data-tab="birthday">생일파티</button>
      <button class="tab-btn" data-tab="journal">예배일지</button>
      <button class="tab-btn" data-tab="bulletin">주보보관함</button>
    </div>
  </header>

  <main>
    <section id="tab-attendance">
      <div class="summary-grid">
        <div class="stat-box">
          <div class="stat-label">출석 인원</div>
          <div class="stat-val" id="presentCount">0명</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">전체 등록 청년</div>
          <div class="stat-val" id="totalCount">0명</div>
        </div>
      </div>

      <div class="card">
        <h2>청년 명단 &amp; 출석 체크</h2>
        <div id="memberList"></div>
      </div>

      <div class="card">
        <h2>새 청년 추가</h2>
        <input class="field" id="newName" placeholder="이름 (예: 홍길동)" />
        <div class="two-col">
          <input class="field" id="newGroup" placeholder="순/조 (예: 1순)" />
          <input class="field" id="newBirthday" placeholder="생일 MM-DD (예: 11-28)" />
        </div>
        <button class="btn-primary" id="addMemberBtn">청년 등록하기</button>
      </div>
    </section>

    <section id="tab-birthday" class="hidden">
      <div class="card">
        <h2>생일 명단 관리 (수정·삭제 가능)</h2>
        <div id="birthdayList"></div>
      </div>
    </section>

    <section id="tab-journal" class="hidden">
      <div class="card">
        <h2>예배일지 작성</h2>
        <input class="field" id="journalDate" type="date" />
        <input class="field" id="journalTitle" placeholder="설교 제목 / 말씀 본문" />
        <textarea class="field" id="journalNote" rows="3" placeholder="은혜 나눈 내용 및 기도제목"></textarea>
        <button class="btn-primary" id="addJournalBtn">예배일지 저장</button>
      </div>
      <div class="card">
        <h2>예배일지 목록</h2>
        <div id="journalList"></div>
      </div>
    </section>

    <section id="tab-bulletin" class="hidden">
      <div class="card">
        <h2>주보 등록</h2>
        <input class="field" id="bulletinDate" type="date" />
        <input class="field" id="bulletinTitle" placeholder="주보 제목 (예: 11월 넷째 주 주보)" />
        <textarea class="field" id="bulletinBody" rows="3" placeholder="공지사항 / 모임 안내"></textarea>
        <button class="btn-primary" id="addBulletinBtn">주보 저장</button>
      </div>
      <div class="card">
        <h2>주보보관함</h2>
        <div id="bulletinList"></div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "onbit_youth_data_v1";
    const SUPABASE_URL = window.ONBIT_SUPABASE_URL || "";
    const SUPABASE_ANON_KEY = window.ONBIT_SUPABASE_ANON_KEY || "";

    const defaultData = {
      members: [
        { id: "m1", name: "김하늘", group: "1순", birthday: "11-28", status: "present" },
        { id: "m2", name: "이소망", group: "1순", birthday: "11-15", status: "present" },
        { id: "m3", name: "박은혜", group: "2순", birthday: "12-04", status: "present" },
        { id: "m4", name: "최온유", group: "2순", birthday: "03-19", status: "present" },
        { id: "m5", name: "이예송", group: "1순", birthday: "09-25", status: "absent" }
      ],
      journals: [
        { id: "j1", date: "2026-11-22", title: "빛 가운데 행하라", note: "함께 기도하며 한 주를 다짐함" }
      ],
      bulletins: [
        { id: "b1", date: "2026-11-22", title: "11월 넷째 주 청년부 주보", note: "주일 오후 2시 순모임 진행" }
      ]
    };

    let state = loadState();
    let editingMemberId = null;
    let editingJournalId = null;
    let editingBulletinId = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultData);
        const parsed = JSON.parse(raw);
        return {
          members: Array.isArray(parsed.members) ? parsed.members : structuredClone(defaultData.members),
          journals: Array.isArray(parsed.journals) ? parsed.journals : structuredClone(defaultData.journals),
          bulletins: Array.isArray(parsed.bulletins) ? parsed.bulletins : structuredClone(defaultData.bulletins)
        };
      } catch {
        return structuredClone(defaultData);
      }
    }

    async function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderAll();
      if (SUPABASE_URL && SUPABASE_ANON_KEY) {
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/onbit_state?id=eq.main`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              Prefer: "return=minimal"
            },
            body: JSON.stringify({ payload: state, updated_at: new Date().toISOString() })
          });
          document.getElementById("syncStatus").textContent = "Supabase 동기화됨";
        } catch {
          document.getElementById("syncStatus").textContent = "로컬 저장됨 (오프라인)";
        }
      }
    }

    function esc(str = "") {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderAll() {
      renderAttendance();
      renderBirthdays();
      renderJournals();
      renderBulletins();
    }

    function renderAttendance() {
      const present = state.members.filter(m => m.status === "present").length;
      document.getElementById("presentCount").textContent = `${present}명`;
      document.getElementById("totalCount").textContent = `${state.members.length}명`;

      const container = document.getElementById("memberList");
      if (!state.members.length) {
        container.innerHTML = `<div class="item-sub">등록된 청년이 없습니다. 아래에서 추가해 주세요.</div>`;
        return;
      }

      container.innerHTML = state.members.map(m => {
        const isEditing = editingMemberId === m.id;
        return `
          <div class="item-row" style="flex-direction: column; align-items: stretch;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <div class="item-main">
                <div class="item-title">${esc(m.name)} · ${esc(m.group || "미지정")}</div>
                <div class="item-sub">생일 ${esc(m.birthday || "-")} · ${m.status === "present" ? "출석" : "결석"}</div>
              </div>
              <div class="actions">
                <button class="btn-ok" onclick="setStatus('${m.id}', 'present')">출석</button>
                <button class="btn-no" onclick="setStatus('${m.id}', 'absent')">결석</button>
                <button class="btn-edit" onclick="toggleEditMember('${m.id}')">${isEditing ? "닫기" : "수정"}</button>
                <button class="btn-del" onclick="deleteMember('${m.id}')">삭제</button>
              </div>
            </div>
            ${isEditing ? `
              <div class="edit-panel">
                <input class="field" id="editName-${m.id}" value="${esc(m.name)}" placeholder="이름" />
                <div class="two-col">
                  <input class="field" id="editGroup-${m.id}" value="${esc(m.group)}" placeholder="순/조" />
                  <input class="field" id="editBday-${m.id}" value="${esc(m.birthday)}" placeholder="생일 MM-DD" />
                </div>
                <div class="actions" style="justify-content:flex-start;">
                  <button class="btn-ok" onclick="saveMemberEdit('${m.id}')">수정 저장</button>
                  <button class="btn-secondary" onclick="toggleEditMember(null)">취소</button>
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    function renderBirthdays() {
      const container = document.getElementById("birthdayList");
      if (!state.members.length) {
        container.innerHTML = `<div class="item-sub">등록된 생일 정보가 없습니다.</div>`;
        return;
      }

      container.innerHTML = state.members.map(m => {
        const isEditing = editingMemberId === m.id;
        return `
          <div class="item-row" style="flex-direction: column; align-items: stretch;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <div class="item-main">
                <div class="item-title">${esc(m.name)} (${esc(m.group || "-")})</div>
                <div class="item-sub">생일: ${esc(m.birthday || "미입력")}</div>
              </div>
              <div class="actions">
                <button class="btn-edit" onclick="toggleEditMember('${m.id}')">${isEditing ? "닫기" : "생일·정보 수정"}</button>
                <button class="btn-del" onclick="deleteMember('${m.id}')">삭제</button>
              </div>
            </div>
            ${isEditing ? `
              <div class="edit-panel">
                <input class="field" id="editName-${m.id}" value="${esc(m.name)}" placeholder="이름" />
                <div class="two-col">
                  <input class="field" id="editGroup-${m.id}" value="${esc(m.group)}" placeholder="순/조" />
                  <input class="field" id="editBday-${m.id}" value="${esc(m.birthday)}" placeholder="생일 MM-DD" />
                </div>
                <div class="actions" style="justify-content:flex-start;">
                  <button class="btn-ok" onclick="saveMemberEdit('${m.id}')">저장</button>
                  <button class="btn-secondary" onclick="toggleEditMember(null)">취소</button>
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    function renderJournals() {
      const container = document.getElementById("journalList");
      if (!state.journals.length) {
        container.innerHTML = `<div class="item-sub">작성된 예배일지가 없습니다.</div>`;
        return;
      }
      container.innerHTML = state.journals.map(j => {
        const isEditing = editingJournalId === j.id;
        return `
          <div class="item-row" style="flex-direction: column; align-items: stretch;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
              <div class="item-main">
                <div class="item-title">${esc(j.title)}</div>
                <div class="item-sub">${esc(j.date)} · ${esc(j.note)}</div>
              </div>
              <div class="actions">
                <button class="btn-edit" onclick="toggleEditJournal('${j.id}')">${isEditing ? "닫기" : "수정"}</button>
                <button class="btn-del" onclick="deleteJournal('${j.id}')">삭제</button>
              </div>
            </div>
            ${isEditing ? `
              <div class="edit-panel">
                <input class="field" type="date" id="editJDate-${j.id}" value="${esc(j.date)}" />
                <input class="field" id="editJTitle-${j.id}" value="${esc(j.title)}" />
                <textarea class="field" rows="2" id="editJNote-${j.id}">${esc(j.note)}</textarea>
                <div class="actions" style="justify-content:flex-start;">
                  <button class="btn-ok" onclick="saveJournalEdit('${j.id}')">수정 저장</button>
                  <button class="btn-secondary" onclick="toggleEditJournal(null)">취소</button>
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    function renderBulletins() {
      const container = document.getElementById("bulletinList");
      if (!state.bulletins.length) {
        container.innerHTML = `<div class="item-sub">등록된 주보가 없습니다.</div>`;
        return;
      }
      container.innerHTML = state.bulletins.map(b => {
        const isEditing = editingBulletinId === b.id;
        return `
          <div class="item-row" style="flex-direction: column; align-items: stretch;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
              <div class="item-main">
                <div class="item-title">${esc(b.title)}</div>
                <div class="item-sub">${esc(b.date)} · ${esc(b.note)}</div>
              </div>
              <div class="actions">
                <button class="btn-edit" onclick="toggleEditBulletin('${b.id}')">${isEditing ? "닫기" : "수정"}</button>
                <button class="btn-del" onclick="deleteBulletin('${b.id}')">삭제</button>
              </div>
            </div>
            ${isEditing ? `
              <div class="edit-panel">
                <input class="field" type="date" id="editBDate-${b.id}" value="${esc(b.date)}" />
                <input class="field" id="editBTitle-${b.id}" value="${esc(b.title)}" />
                <textarea class="field" rows="2" id="editBNote-${b.id}">${esc(b.note)}</textarea>
                <div class="actions" style="justify-content:flex-start;">
                  <button class="btn-ok" onclick="saveBulletinEdit('${b.id}')">수정 저장</button>
                  <button class="btn-secondary" onclick="toggleEditBulletin(null)">취소</button>
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    window.setStatus = (id, status) => {
      const target = state.members.find(m => m.id === id);
      if (!target) return;
      target.status = status;
      saveState();
    };

    window.toggleEditMember = (id) => {
      editingMemberId = editingMemberId === id ? null : id;
      renderAll();
    };

    window.saveMemberEdit = (id) => {
      const target = state.members.find(m => m.id === id);
      if (!target) return;
      const name = document.getElementById(`editName-${id}`)?.value.trim();
      const group = document.getElementById(`editGroup-${id}`)?.value.trim();
      const birthday = document.getElementById(`editBday-${id}`)?.value.trim();
      if (!name) return alert("이름을 입력해 주세요.");
      target.name = name;
      target.group = group;
      target.birthday = birthday;
      editingMemberId = null;
      saveState();
    };

    window.deleteMember = (id) => {
      if (!confirm("이 청년 정보를 삭제할까요?")) return;
      state.members = state.members.filter(m => m.id !== id);
      if (editingMemberId === id) editingMemberId = null;
      saveState();
    };

    document.getElementById("addMemberBtn").addEventListener("click", () => {
      const name = document.getElementById("newName").value.trim();
      const group = document.getElementById("newGroup").value.trim() || "1순";
      const birthday = document.getElementById("newBirthday").value.trim();
      if (!name) return alert("이름을 입력해 주세요.");
      state.members.push({
        id: "m_" + Date.now(),
        name,
        group,
        birthday,
        status: "present"
      });
      document.getElementById("newName").value = "";
      document.getElementById("newGroup").value = "";
      document.getElementById("newBirthday").value = "";
      saveState();
    });

    document.getElementById("addJournalBtn").addEventListener("click", () => {
      const date = document.getElementById("journalDate").value || new Date().toISOString().slice(0, 10);
      const title = document.getElementById("journalTitle").value.trim();
      const note = document.getElementById("journalNote").value.trim();
      if (!title) return alert("제목을 입력해 주세요.");
      state.journals.unshift({ id: "j_" + Date.now(), date, title, note });
      document.getElementById("journalTitle").value = "";
      document.getElementById("journalNote").value = "";
      saveState();
    });

    window.toggleEditJournal = (id) => {
      editingJournalId = editingJournalId === id ? null : id;
      renderJournals();
    };

    window.saveJournalEdit = (id) => {
      const item = state.journals.find(j => j.id === id);
      if (!item) return;
      item.date = document.getElementById(`editJDate-${id}`).value || item.date;
      item.title = document.getElementById(`editJTitle-${id}`).value.trim() || item.title;
      item.note = document.getElementById(`editJNote-${id}`).value.trim();
      editingJournalId = null;
      saveState();
    };

    window.deleteJournal = (id) => {
      if (!confirm("이 예배일지를 삭제할까요?")) return;
      state.journals = state.journals.filter(j => j.id !== id);
      if (editingJournalId === id) editingJournalId = null;
      saveState();
    };

    document.getElementById("addBulletinBtn").addEventListener("click", () => {
      const date = document.getElementById("bulletinDate").value || new Date().toISOString().slice(0, 10);
      const title = document.getElementById("bulletinTitle").value.trim();
      const note = document.getElementById("bulletinBody").value.trim();
      if (!title) return alert("주보 제목을 입력해 주세요.");
      state.bulletins.unshift({ id: "b_" + Date.now(), date, title, note });
      document.getElementById("bulletinTitle").value = "";
      document.getElementById("bulletinBody").value = "";
      saveState();
    });

    window.toggleEditBulletin = (id) => {
      editingBulletinId = editingBulletinId === id ? null : id;
      renderBulletins();
    };

    window.saveBulletinEdit = (id) => {
      const item = state.bulletins.find(b => b.id === id);
      if (!item) return;
      item.date = document.getElementById(`editBDate-${id}`).value || item.date;
      item.title = document.getElementById(`editBTitle-${id}`).value.trim() || item.title;
      item.note = document.getElementById(`editBNote-${id}`).value.trim();
      editingBulletinId = null;
      saveState();
    };

    window.deleteBulletin = (id) => {
      if (!confirm("이 주보를 삭제할까요?")) return;
      state.bulletins = state.bulletins.filter(b => b.id !== id);
      if (editingBulletinId === id) editingBulletinId = null;
      saveState();
    };

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        ["attendance", "birthday", "journal", "bulletin"].forEach(t => {
          document.getElementById(`tab-${t}`).classList.toggle("hidden", t !== tab);
        });
      });
    });

    document.getElementById("journalDate").value = new Date().toISOString().slice(0, 10);
    document.getElementById("bulletinDate").value = new Date().toISOString().slice(0, 10);
    renderAll();
  </script>
</body>
</html>
